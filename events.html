
<!DOCTYPE html>
<html lang="en">

    <title>School Events</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>School Event Hub</h1>

    
<nav>
    <a href="index.html">Home</a>
     <a href="past-events.html">Past Events</a>
    <a href="events.html">Events</a>
    <a href="my-registrations.html">My Events</a>
    <a href="profile.html">My Profile</a>

    <a href="create-event.html">Create Event</a>

    <a href="notifications.html">
        Notifications
        <span id="notificationCount"></span>
    </a>

    <button id="logoutButton">Logout</button>
</nav>

<main class="events-container">

    <section class="welcome-banner">

        <h2>Discover School Events!</h2>

        <p>
            Explore activities, meet new people and
            find something exciting to do.
        </p>

        <a href="create-event.html" class="button">
            + Create New Event
        </a>

    </section>

    <section>

        <h2>Explore Events</h2>

        <input
            type="search"
            id="searchInput"
            placeholder="Search events by name or location..."
        >
<label for="categoryFilter">Filter by category</label>

<select id="categoryFilter">

    <option value="">All Categories</option>

    <option value="Music">🎵 Music</option>

    <option value="Science">🔬 Science</option>

    <option value="Sports">🏆 Sports</option>

    <option value="Arts">🎨 Arts</option>

    <option value="Academic">🎓 Academic</option>

    <option value="Social">👥 Social</option>

    <option value="Other">📅 Other</option>

</select>
        <div id="eventsList" class="events-grid">

            <p>Loading events...</p>

        </div>

    </section>

</main>


<footer>
    <p>School Event Hub &copy; 2026</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
