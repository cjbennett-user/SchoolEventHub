
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - School Event Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>School Event Hub</h1>

   
<nav>
    <a href="index.html">Home</a>
    <a href="past-events.html">Past Events</a>
    <a href="events.html">Events</a>
    <a href="create-event.html">Create Event</a>
    <a href="my-registrations.html">My Events</a>

    <a href="notifications.html">
        Notifications
        <span id="notificationCount"></span>
    </a>
    <a href="profile.html">My Profile</a>

    <button id="logoutButton">Logout</button>
</nav>

</header>

<main>

    <section class="event-card" style="max-width:550px; margin:40px auto;">

        <h2>Edit Event</h2>

        <form id="editEventForm">

            <label for="eventName">Event Name</label>
            <input type="text" id="eventName" required>

            <label for="description">Description</label>
            <textarea id="description" required></textarea>
<label for="category">Event Category</label>

<select id="category" required>
    <option value="Music">🎵 Music</option>
    <option value="Science">🔬 Science</option>
    <option value="Sports">🏆 Sports</option>
    <option value="Arts">🎨 Arts</option>
    <option value="Academic">🎓 Academic</option>
    <option value="Social">👥 Social</option>
    <option value="Technology">💻 Technology</option>
    <option value="Health">🩺 Health</option>
    <option value="Fundraising">💰 Fundraising</option>
    <option value="Other">📅 Other</option>
</select>
            <label for="location">Location</label>
            <input type="text" id="location" required>

            <label for="eventDate">Event Date</label>
            <input type="date" id="eventDate" required>

            <fieldset id="startTimePicker" class="time-picker">
                <legend>Start Time</legend>
            </fieldset>

            <fieldset id="endTimePicker" class="time-picker">
                <legend>End Time</legend>
            </fieldset>

            <br><br>

            <button type="submit">Save Changes</button>

            <a href="events.html">Cancel</a>

        </form>

        <p id="message"></p>

    </section>

</main>

<footer>
    <p>School Event Hub &copy; 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="date-utils.js"></script>
<script src="time-picker.js"></script>
<script src="notification-count.js"></script>
<script src="events-auth.js"></script>
<script src="edit-event.js"></script>

</body>
</html>
